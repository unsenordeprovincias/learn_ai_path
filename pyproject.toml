[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist"
version = "0.1.0"
description = "learning path from mnist"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview",
    "numpy",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["src", "."]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
